name: jozve-agent

# 🤖 ایجنت جزوه — با repository_dispatch از ربات بالا می‌آید، جزوه را می‌سازد
# و output.md را روی همان شاخهٔ موقت کامیت می‌کند؛ سپس ماشین خاموش می‌شود.
#
# کانفیگ opencode.json از jozve_models.json ساخته می‌شود (منبع واحد حقیقت).
# مدل‌های تامین‌کننده‌های پشتیبان پیش از اجرا با endpoint /models خودشان بررسی
# می‌شوند تا مدل‌های بازنشسته (مثل llama-3.3-70b) دیگر جور شغلتان را نبهالند.
# اگر مدل انتخابی شکست بخورد، یک‌بار با مدل پیش‌فرض (اولویت: زن ← گمینی ← …) تلاش می‌شود.
on:
  repository_dispatch:
    types: [jozve-job]

permissions:
  contents: write

concurrency:
  group: jozve-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout job branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install opencode
        run: |
          set -euo pipefail
          npm install -g opencode-ai@latest --silent
          opencode --version

      - name: Prepare opencode config from jozve_models.json
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          models_cfg = json.load(open("jozve_models.json", encoding="utf-8"))
          provs = models_cfg.get("providers") or {}
          models = models_cfg.get("models") or []

          def env_key(name):
              return (os.getenv(name or "") or "").strip()

          def fetch_live(url, key):
              """فهرست زندهٔ مدل‌های تامین‌کننده — خطا ← None (مدل‌ها حذف نمی‌شوند)"""
              if not url or not key:
                  return None
              try:
                  req = urllib.request.Request(
                      url, headers={"Authorization": "Bearer " + key,
                                    "User-Agent": "jozve-agent"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.load(r).get("data", [])
                  return {m.get("id") for m in data if m.get("id")}
              except Exception as e:
                  print("verify skip:", type(e).__name__, str(e)[:120])
                  return None

          def in_live(mid, live, pid=""):
              """تطبیق چندشکلی شناسه: کامل، بدون پیشوند تامین‌کننده، با/بدون models/ (گمینی)
              نکته: شناسهٔ openrouter خودش «/» دارد (nvidia/...) — پس فقط پیشوندِ
              خود تامین‌کنندهٔ کانفیگ حذف می‌شود، نه بیشتر."""
              cands = [mid]
              if pid and mid.startswith(pid + "/"):
                  cands.append(mid[len(pid) + 1:])
              for c in list(cands):
                  if c.startswith("models/"):
                      cands.append(c[7:])
              for c in cands:
                  if c in live or ("models/" + c) in live:
                      return True
              return False

          def build_provider(pid, pm):
              """ساخت ورودی تامین‌کننده برای opencode.json از فهرست مدل‌های pm"""
              spec = provs.get(pid) or {}
              mm = {}
              for m in pm:
                  entry = {"name": m.get("label") or m["id"]}
                  lim = {}
                  if m.get("ctx"):
                      lim["context"] = int(m["ctx"])
                  if m.get("out"):
                      lim["output"] = int(m["out"])
                  if lim:
                      entry["limit"] = lim
                  mm[m["id"].split("/", 1)[1]] = entry
              opts = {"apiKey": "{env:%s}" % spec.get("env")}
              if spec.get("baseURL"):
                  opts["baseURL"] = spec["baseURL"]
              pe = {"npm": spec.get("npm") or "@ai-sdk/openai-compatible",
                    "name": spec.get("label") or pid,
                    "options": opts, "models": mm}
              if spec.get("headers"):
                  pe["headers"] = spec["headers"]
              return pe

          # ترتیب تامین‌کننده‌ها بر اساس ترتیب مدل‌های فایل
          prov_order = []
          for m in models:
              pid = m.get("provider") or ""
              if pid and pid not in prov_order:
                  prov_order.append(pid)

          conf_provs = {}
          for pid in prov_order:
              spec = provs.get(pid) or {}
              if not spec:
                  continue
              key = env_key(spec.get("env"))
              if spec.get("native"):
                  # سرویس رسمی OpenCode Zen — بومیِ CLI؛ فقط احراز هویت
                  if key:
                      auth_dir = os.path.expanduser("~/.local/share/opencode")
                      os.makedirs(auth_dir, exist_ok=True)
                      with open(os.path.join(auth_dir, "auth.json"), "w",
                                encoding="utf-8") as f:
                          json.dump({"opencode": {"type": "api", "key": key}}, f)
                      print("zen: auth.json نوشته شد ✓")
                  else:
                      print("zen: کلید OPENCODE_API_KEY تنظیم نشده")
                  continue
              if not key:
                  print("skip provider (کلید ندارد):", pid)
                  continue
              pm = [m for m in models if (m.get("provider") or "") == pid]
              live = fetch_live(spec.get("verify"), key)
              # prune فقط وقتی فهرست زندهٔ غیرخالی گرفتیم — خطا/لیست خالی یعنی نگه‌دار
              if live:
                  keep = [m for m in pm if in_live(m["id"], live, pid)]
                  dropped = [m["id"] for m in pm if m not in keep]
                  if dropped:
                      print("حذف شد (مدل بازنشسته):", ", ".join(dropped))
                  pm = keep
              elif live is not None:
                  print("هشدار: فهرست زندهٔ", pid, "خالی بود — همهٔ مدل‌ها نگه داشته شدند")
              if not pm:
                  print("skip provider (مدل زنده‌ای ندارد):", pid)
                  continue
              conf_provs[pid] = build_provider(pid, pm)

          if not conf_provs:
              # تور ایمنی: هیچ تامین‌کننده‌ای از prune جان نبرد — با کلیدهای موجود
              # همهٔ مدل‌های فایل را بدون بررسی زنده بساز تا ایجنت همیشه قابل اجرا باشد
              print("!! هیچ تامین‌کنندهٔ زنده‌ای نماند — ساخت بدون فیلتر بازنشستگی")
              for pid in prov_order:
                  spec = provs.get(pid) or {}
                  if not spec or spec.get("native"):
                      continue
                  if env_key(spec.get("env")):
                      pm = [m for m in models if (m.get("provider") or "") == pid]
                      if pm:
                          conf_provs[pid] = build_provider(pid, pm)

          # مدل پیش‌فرض برای تلاش مجدد: اولویت زن ← بقیه به ترتیب فایل
          default = ""
          if env_key("OPENCODE_API_KEY"):
              for m in models:
                  if (m.get("provider") or "") == "opencode":
                      default = m["id"]
                      break
          if not default:
              for pid in prov_order:
                  if pid in conf_provs:
                      default = [m["id"] for m in models
                                 if (m.get("provider") or "") == pid][0]
                      break

          cfg = {"$schema": "https://opencode.ai/config.json",
                 "autoupdate": False,
                 "permission": {"edit": "allow", "bash": "allow", "webfetch": "allow"}}
          if conf_provs:
              cfg["provider"] = conf_provs
          with open("opencode.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print("providers:", ", ".join(conf_provs) or "(فقط زن/هیچ)")
          print("default model:", default or "NONE")
          with open(os.environ.get("GITHUB_ENV", "/tmp/gh_env"), "a",
                    encoding="utf-8") as f:
              f.write("DEFAULT_MODEL=%s\n" % default)
          PY

      - name: Install PDF toolchain + Persian font
        run: |
          set -euo pipefail
          pip install --quiet weasyprint
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          fc-cache -f >/dev/null 2>&1 || true

      - name: Run opencode agent
        env:
          JOB: ${{ github.event.client_payload.job_id }}
          MODEL: ${{ github.event.client_payload.model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          echo "job=$JOB model=$MODEL default=${DEFAULT_MODEL:-}"
          TASK=$(printf '%s' "وظیفهٔ تو ساخت یک جزوهٔ درسی کامل است.
          ۱) فایل jozve_prompt.md را کامل بخوان؛ این سند، دستورالعمل رسمی ساخت جزوه است و باید دقیقاً و بدون کوتاهی اجرا شود (قالب خروجی: یک سند HTML کامل و مستقل).
          ۲) متن خام رونویسی در agent-jobs/$JOB/input.txt قرار دارد و استایل الزامی (پالت رنگی و دستور مدیر) در agent-jobs/$JOB/style.json است — style_block آن را کلمه‌به‌کلمه اجرا کن.
          ۳) کل متن را چند بار مرور کن، طرح کلی بچین و جزوهٔ کامل و یکپارچه را طبق jozve_prompt.md بنویس و در agent-jobs/$JOB/output.html ذخیره کن — فقط همین یک فایل.
          ۴) پس از ذخیرهٔ output.html، با bash این فرمان را اجرا کن تا PDF ساخته شود: python3 -m weasyprint agent-jobs/$JOB/output.html agent-jobs/$JOB/output.pdf
          ۵) زبان جزوه حتماً فارسی روان است. هیچ بخشی از متن ورودی نباید بدون پوشش بماند و خروجی نباید کوتاه‌تر از حد لازم باشد.")
          run_oc() {
            opencode run --auto -m "$1" --title "$2" "$TASK" </dev/null 2>&1 | tee /tmp/oc.log
          }
          HTMLF="agent-jobs/$JOB/output.html"
          PDFF="agent-jobs/$JOB/output.pdf"
          # فهرست همهٔ مدل‌های کانفیگ‌شده — برای تلاش جایگزین وقتی مدل اصلی (مثلاً با سهمیهٔ تمام‌شده) جواب نداد
          ALL_MODELS=$(python3 - <<'PY'
          import json
          try:
              cfg = json.load(open("opencode.json", encoding="utf-8"))
          except Exception:
              raise SystemExit
          out = []
          for pid, p in (cfg.get("provider") or {}).items():
              for mk in (p.get("models") or {}):
                  out.append(pid + "/" + mk)
          print("\n".join(out))
          PY
          )
          run_oc() {
            opencode run --auto -m "$1" --title "$2" "$TASK" </dev/null 2>&1 | tee /tmp/oc.log
          }
          try_model() {   # $1=مدل  $2=برچسب — موفق یعنی output.html واقعاً ساخته شد
            run_oc "$1" "jozve-$JOB-$2"
            [ -s "$HTMLF" ]
          }
          if ! try_model "$MODEL" "main"; then
            echo "::warning::مدل $MODEL خروجی نساخت — تلاش با بقیهٔ مدل‌ها"
            while IFS= read -r m; do
              [ -n "$m" ] || continue
              [ "$m" = "$MODEL" ] && continue
              if [ -n "${DEFAULT_MODEL:-}" ] && [ "$m" = "$DEFAULT_MODEL" ]; then continue; fi
              echo "::warning::تلاش با مدل جایگزین: $m"
              if try_model "$m" "alt"; then break; fi
            done <<< "$ALL_MODELS"
            if [ ! -s "$HTMLF" ] && [ -n "${DEFAULT_MODEL:-}" ] && [ "$MODEL" != "$DEFAULT_MODEL" ]; then
              try_model "$DEFAULT_MODEL" "fb" || true
            fi
          fi
          if [ ! -s "$HTMLF" ]; then
            echo "::warning::output.html توسط ایجنت نوشته نشد — استخراج از خروجی استاندارد"
            grep -vE '^(opencode v|>|→|[0-9]{4}-[0-9]{2}-[0-9]{2}T)' /tmp/oc.log > "$HTMLF" || true
          fi
          [ -s "$HTMLF" ] || { echo "::error::هیچ خروجی‌ای تولید نشد"; exit 1; }
          # اعتبارسنجی: خروجی باید واقعاً سند HTML باشد، نه لاگ ایجنت
          if ! grep -qi "<html" "$HTMLF"; then
            echo "::error::خروجی ایجنت سند HTML نبود"
            tail -c 400 /tmp/oc.log || true
            exit 1
          fi
          # اگر خود ایجنت PDF نساخته بود، همین‌جا ساخته می‌شود (تور ایمنی)
          if [ ! -s "$PDFF" ]; then
            python3 -m weasyprint "$HTMLF" "$PDFF" || echo "::warning::تبدیل PDF ناموفق بود — فقط HTML کامیت می‌شود"
          fi
          echo "خروجی: html=$(wc -c < "$HTMLF") بایت$( [ -s "$PDFF" ] && echo ", pdf=$(wc -c < "$PDFF") بایت" )"

      - name: Commit agent output
        if: success()
        run: |
          set -euo pipefail
          git config user.name "jozve-agent"
          git config user.email "actions@users.noreply.github.com"
          git add "agent-jobs/${{ github.event.client_payload.job_id }}" || true
          git commit -m "jozve output: ${{ github.event.client_payload.job_id }}"
          git push origin "HEAD:${{ github.event.client_payload.branch }}"

      - name: Commit error report
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "jozve-agent"
          git config user.email "actions@users.noreply.github.com"
          echo "ساخت جزوه روی ایجنت ناموفق بود؛ جزئیات در لاگ اجرای Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "agent-jobs/${{ github.event.client_payload.job_id }}/error.txt"
          git add "agent-jobs/${{ github.event.client_payload.job_id }}" || true
          git commit -m "jozve error: ${{ github.event.client_payload.job_id }}" || echo "nothing to commit"
          git push origin "HEAD:${{ github.event.client_payload.branch }}" || true

